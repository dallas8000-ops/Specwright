# Specwright on Render — API (Docker) + static React UI
# Dashboard: connect repo → Blueprint → New Blueprint Instance → this file
version: "1"

services:
  - type: web
    name: specwright-api
    runtime: docker
    plan: free
    dockerfilePath: ./api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: SPECWRIGHT_DEBUG
        value: "false"
      - key: SPECWRIGHT_DATABASE_URL
        value: sqlite+aiosqlite:///specwright.db
      - key: SPECWRIGHT_FRONTEND_URL
        sync: false
      - key: SPECWRIGHT_PUBLIC_API_URL
        sync: false
      - key: SPECWRIGHT_PUBLIC_SITE_URL
        sync: false
      - key: SPECWRIGHT_AI_API_KEY
        sync: false
      - key: SPECWRIGHT_GITHUB_TOKEN
        sync: false
      - key: SPECWRIGHT_STRIPE_SECRET_KEY
        sync: false
      - key: SPECWRIGHT_STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SPECWRIGHT_STRIPE_PRICE_ID_STARTER
        sync: false
      - key: SPECWRIGHT_STRIPE_PRICE_ID_PRO
        sync: false

  - type: web
    name: specwright-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
